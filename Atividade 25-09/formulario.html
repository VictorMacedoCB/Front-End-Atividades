<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        *{
            margin: 0 auto;
            padding: 0;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;

        }
        body {
            background-color: #518CFC;
            color: white;
        }

        form {
            align-items: center;
        }
        .formulario {
            width: 100%;
            padding: 10px;
            font-size: 20px;
            display: flex;
            margin-bottom: 10px;
            flex-direction: column;
        }
        .botao {
            margin: 20px auto;
            padding: 10px;
            font-size: 20px;
            display: block;
            justify-content: center;

        }
    </style>
</head>
<body>
<form action="atividade.html" method="get">
    <h1>Formulario de Contato</h1>
    <div class="formulario">
        <label for=""> Digite seu nome</label>
            <input type="text" name="Digite seu nome" id="nome" placeholder="Digite seu nome">
    </div>
    <div class="formulario">
         <label for="">Digite seu numero de contato</label>
            <input type="number" name="Numero de telefone" id="telefone">
    </div>
    <div class="formulario">
        <label for="">Digite seu email</label>
        <input type="email" name="email" id="email">
    </div>
      <div class="formulario">
        <label for="">Digite seu endereço </label>
        <input type="text" name="endereco" id="endereco">
    </div>
    <input type="button" class="botao" value="Enviar">
</form>
</body>
</html>
